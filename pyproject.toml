[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "typefast"
version = "0.1.0"
description = "TypeFast - Windows AI voice input (cloud first)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "TypeFast" }]
dependencies = ["requests>=2.31", "numpy>=1.24", "psutil>=5.9"]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6"]
secrets = ["keyring>=23"]
hud = ["pillow>=9.0"]
dev = ["pytest>=7.4"]

[project.scripts]
typefast = "typefast.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
